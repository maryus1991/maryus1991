<svg viewBox="0 0 900 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Profile Service — central identity card">
  <title>Profile Service — Central Identity &amp; Information</title>
  <defs>
    <style>
      .card-bg { fill: #161b22; }
      .card-border { fill: none; stroke: #21262d; stroke-width: 1.5; }
      .glow { fill: none; stroke: #3fb950; stroke-width: 2; filter: url(#soft-blur); animation: breathe 4s ease-in-out infinite; }
      .dot-grid { fill: url(#dots); opacity: 0.6; }
      .eyebrow { font-family: ui-monospace, "SF Mono", "Cascadia Code", Menlo, Consolas, monospace; font-size: 13px; letter-spacing: 3px; fill: #58a6ff; }
      .name { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 34px; font-weight: 700; fill: #e6edf3; }
      .role { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 17px; fill: #7d8590; }
      .divider { stroke: #21262d; stroke-width: 1; }
      .row-label { font-family: ui-monospace, "SF Mono", "Cascadia Code", Menlo, Consolas, monospace; font-size: 11px; letter-spacing: 1px; fill: #545d68; }
      .row-value { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 15px; fill: #e6edf3; }
      .row-value.link { fill: #58a6ff; }
      .icon { fill: none; stroke: #7d8590; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
      .hub-ring { fill: none; stroke: #30363d; stroke-width: 1.5; transform-origin: 150px 160px; animation: rotate-slow 22s linear infinite; }
      .hub-ring-accent { fill: none; stroke: #3fb950; stroke-width: 2; stroke-dasharray: 6 14; transform-origin: 150px 160px; animation: rotate-slow 14s linear infinite reverse; }
      .hub-node { fill: #3fb950; }
      .hub-core { fill: #0d1117; stroke: #30363d; stroke-width: 1.5; }
      .hub-spoke { stroke: #30363d; stroke-width: 1.5; }
      .hub-satellite { fill: #58a6ff; animation: pulse-dot 2.6s ease-in-out infinite; }
      .status-pill { fill: rgba(63,185,80,0.12); stroke: rgba(63,185,80,0.4); stroke-width: 1; }
      .status-text { font-family: ui-monospace, monospace; font-size: 12px; font-weight: 600; letter-spacing: 1px; fill: #3fb950; }
      .status-dot { fill: #3fb950; animation: pulse-dot 2s ease-in-out infinite; }
      .status-ring { fill: none; stroke: #3fb950; stroke-width: 1.5; transform-origin: 810px 273px; animation: pulse-ring 2s ease-out infinite; }
      .term-line { font-family: ui-monospace, monospace; font-size: 13px; fill: #7d8590; }
      .term-prompt { fill: #3fb950; }
      .term-cursor { fill: #3fb950; animation: blink 1s step-end infinite; }
      .edge-node { fill: #0d1117; stroke: #3fb950; stroke-width: 1.5; }
      .edge-node-dot { fill: #3fb950; animation: pulse-dot 2.4s ease-in-out infinite; }

      @keyframes breathe { 0%, 100% { opacity: 0.22; } 50% { opacity: 0.65; } }
      @keyframes rotate-slow { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
      @keyframes pulse-dot { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
      @keyframes pulse-ring { 0% { opacity: 0.7; transform: scale(0.6); } 100% { opacity: 0; transform: scale(2.6); } }
      @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
    </style>
    <filter id="soft-blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1" fill="#1c2129"/>
    </pattern>
    <radialGradient id="hub-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3fb950" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#3fb950" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect class="glow" x="6" y="6" width="888" height="308" rx="22"/>
  <rect class="card-bg" x="1" y="1" width="898" height="318" rx="20"/>
  <rect class="dot-grid" x="1" y="1" width="898" height="318" rx="20"/>
  <rect class="card-border" x="1" y="1" width="898" height="318" rx="20"/>

  <!-- edge ports: this is the one node every other service card connects to -->
  <g>
    <circle cx="450" cy="1" r="5" class="edge-node"/>
    <circle cx="450" cy="1" r="2" class="edge-node-dot"/>
  </g>
  <g>
    <circle cx="1" cy="160" r="5" class="edge-node"/>
    <circle cx="1" cy="160" r="2" class="edge-node-dot"/>
  </g>
  <g>
    <circle cx="899" cy="160" r="5" class="edge-node"/>
    <circle cx="899" cy="160" r="2" class="edge-node-dot"/>
  </g>
  <g>
    <circle cx="450" cy="319" r="5" class="edge-node"/>
    <circle cx="450" cy="319" r="2" class="edge-node-dot"/>
  </g>
  <g>
    <circle cx="150" cy="160" r="76" fill="url(#hub-glow)"/>
    <circle cx="150" cy="160" r="72" class="hub-core"/>
    <circle class="hub-ring" cx="150" cy="160" r="58"/>
    <circle class="hub-ring-accent" cx="150" cy="160" r="46"/>
    <line class="hub-spoke" x1="150" y1="160" x2="150" y2="122"/>
    <line class="hub-spoke" x1="150" y1="160" x2="188" y2="160"/>
    <line class="hub-spoke" x1="150" y1="160" x2="150" y2="198"/>
    <line class="hub-spoke" x1="150" y1="160" x2="112" y2="160"/>
    <circle cx="150" cy="122" r="4" class="hub-satellite"/>
    <circle cx="188" cy="160" r="4" class="hub-satellite"/>
    <circle cx="150" cy="198" r="4" class="hub-satellite"/>
    <circle cx="112" cy="160" r="4" class="hub-satellite"/>
    <circle cx="150" cy="160" r="8" class="hub-node"/>
  </g>

  <text x="264" y="76" class="eyebrow">PROFILE SERVICE</text>
  <text x="264" y="112" class="name">Mostafa Ebrahim Zadeh</text>
  <text x="264" y="138" class="role">Backend Engineer</text>
  <line x1="264" y1="160" x2="868" y2="160" class="divider"/>

  <g transform="translate(264, 190)">
    <path class="icon" d="M8 0.5C4.7 0.5 2 3.2 2 6.6c0 4.6 6 10.9 6 10.9s6-6.3 6-10.9C14 3.2 11.3 0.5 8 0.5z"/>
    <circle class="icon" cx="8" cy="6.6" r="2.1"/>
    <text x="26" y="-2" class="row-label">LOCATION</text>
    <text x="26" y="16" class="row-value">Dezful | Ahvaz | Isfahan</text>
  </g>

  <g transform="translate(264, 232)">
    <rect class="icon" x="0" y="1" width="17" height="12" rx="2"/>
    <path class="icon" d="M0.5 2.5l8 6 8-6"/>
    <text x="26" y="-2" class="row-label">EMAIL</text>
    <text x="26" y="16" class="row-value link">maryus19915123@gmail.com</text>
  </g>

  <g transform="translate(560, 190)">
    <circle class="icon" cx="8" cy="8" r="7.5"/>
    <ellipse class="icon" cx="8" cy="8" rx="3.3" ry="7.5"/>
    <line class="icon" x1="0.7" y1="8" x2="15.3" y2="8"/>
    <text x="26" y="-2" class="row-label">WEBSITE</text>
    <text x="26" y="16" class="row-value link">mebram.ir</text>
  </g>

  <g transform="translate(560, 232)">
    <path class="icon" d="M5.5 2.5l-4.5 5.5 4.5 5.5M11.5 2.5l4.5 5.5-4.5 5.5"/>
    <text x="26" y="-2" class="row-label">STACK FOCUS</text>
    <text x="26" y="16" class="row-value">Python · Django · FastAPI</text> 
  </g>

  <g transform="translate(264, 278)">
    <text class="term-line" y="0"><tspan class="term-prompt">$</tspan> status --watch</text>
    <rect class="term-cursor" x="125" y="-11" width="7" height="14"/>
  </g>

  <g transform="translate(770, 258)">
    <rect class="status-pill" x="0" y="0" width="90" height="28" rx="14"/>
    <circle class="status-ring" cx="15" cy="14" r="3.5"/>
    <circle class="status-dot" cx="15" cy="14" r="3.5"/>
    <text x="28" y="18" class="status-text">ACTIVE</text>
  </g>
</svg>