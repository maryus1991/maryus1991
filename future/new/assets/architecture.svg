<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <style>
    .node-circle { fill: #111827; stroke: #00f2fe; stroke-width: 2; transition: all 0.3s ease; }
    .node-circle:hover { fill: #1a2536; stroke-width: 4; filter: drop-shadow(0 0 8px #00f2fe); }
    .conn-line { stroke: #4facfe; stroke-width: 1; stroke-dasharray: 4 4; fill: none; opacity: 0.6; }
    .label { fill: #94a3b8; font-family: monospace; font-size: 10px; text-anchor: middle; }
    .label-light { fill: #ffffff; font-family: monospace; font-size: 12px; font-weight: bold; text-anchor: middle; }
  </style>

  <!-- Central Node -->
  <circle cx="300" cy="200" r="30" class="node-circle" fill="#1e293b" stroke="#00f2fe" stroke-width="4"/>
  <text x="300" y="205" class="label-light" font-size="8">CORE</text>
  
  <!-- Connection Lines -->
  <path d="M 300 170 L 300 80" class="conn-line" />
  <path d="M 300 230 L 300 320" class="conn-line" />
  <path d="M 270 200 L 100 200" class="conn-line" />
  <path d="M 330 200 L 500 200" class="conn-line" />
  
  <path d="M 280 175 L 150 100" class="conn-line" />
  <path d="M 320 175 L 450 100" class="conn-line" />
  <path d="M 280 225 L 150 300" class="conn-line" />
  <path d="M 320 225 L 450 300" class="conn-line" />

  <!-- Peripheral Nodes -->
  <circle cx="300" cy="80" r="15" class="node-circle" />
  <text x="300" y="55" class="label">Frameworks</text>
  
  <circle cx="300" cy="320" r="15" class="node-circle" />
  <text x="300" y="345" class="label">Tech Stack</text>
  
  <circle cx="100" cy="200" r="15" class="node-circle" />
  <text x="100" y="180" class="label">Languages</text>
  
  <circle cx="500" cy="200" r="15" class="node-circle" />
  <text x="500" y="180" class="label">Database</text>

  <circle cx="150" cy="100" r="15" class="node-circle" />
  <text x="150" y="80" class="label">DevOps</text>

  <circle cx="450" cy="100" r="15" class="node-circle" />
  <text x="450" y="80" class="label">Infra</text>

  <circle cx="150" cy="300" r="15" class="node-circle" />
  <text x="150" y="325" class="label">Projects</text>

  <circle cx="450" cy="300" r="15" class="node-circle" />
  <text x="450" y="325" class="label">Monitoring</text>

</svg>